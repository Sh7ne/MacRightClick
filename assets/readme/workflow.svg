<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mac RightClick workflow</title>
  <desc id="desc">Select a file, choose a Finder menu action, convert locally, and receive the output next to the source file.</desc>
  <rect width="1280" height="300" rx="28" fill="#F5F8FC"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="70" y="72" fill="#102033" font-size="30" font-weight="800">One visible action, one local result</text>
    <text x="70" y="108" fill="#56677A" font-size="18">The extension only reacts to the Finder selection. The app writes converted output beside the chosen file.</text>
    <g transform="translate(78 154)">
      <rect width="228" height="88" rx="18" fill="#FFFFFF" stroke="#D9E3EE"/>
      <text x="24" y="38" fill="#111827" font-size="18" font-weight="800">1. Select</text>
      <text x="24" y="64" fill="#617186" font-size="14">PDF, AVI, or any file path</text>
    </g>
    <path d="M328 198H408" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round"/>
    <path d="M396 188L410 198L396 208" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(432 154)">
      <rect width="228" height="88" rx="18" fill="#FFFFFF" stroke="#D9E3EE"/>
      <text x="24" y="38" fill="#111827" font-size="18" font-weight="800">2. Right click</text>
      <text x="24" y="64" fill="#617186" font-size="14">Menu appears only when relevant</text>
    </g>
    <path d="M682 198H762" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round"/>
    <path d="M750 188L764 198L750 208" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(786 154)">
      <rect width="228" height="88" rx="18" fill="#FFFFFF" stroke="#D9E3EE"/>
      <text x="24" y="38" fill="#111827" font-size="18" font-weight="800">3. Convert</text>
      <text x="24" y="64" fill="#617186" font-size="14">PDFKit and AVFoundation</text>
    </g>
    <path d="M1036 198H1116" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round"/>
    <path d="M1104 188L1118 198L1104 208" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1140 154)">
      <rect width="88" height="88" rx="18" fill="#102842"/>
      <path d="M1170 198l12 12 26-30" stroke="#7CFFCB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
