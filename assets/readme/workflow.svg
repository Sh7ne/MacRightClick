<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mac RightClick workflow</title>
  <desc id="desc">Select a Finder item, choose an action, process it locally, and receive a local result.</desc>
  <rect width="1280" height="300" rx="28" fill="#F5F8FC"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="70" y="72" fill="#102033" font-size="30" font-weight="800">One visible action, one local result</text>
    <text x="70" y="108" fill="#56677A" font-size="18">Selected files stay local: paths are copied; converted files are written beside the source.</text>

    <g transform="translate(64 154)">
      <rect width="218" height="88" rx="18" fill="#FFFFFF" stroke="#D9E3EE"/>
      <text x="24" y="38" fill="#111827" font-size="18" font-weight="800">1. Select</text>
      <text x="24" y="64" fill="#617186" font-size="14">Any Finder item</text>
    </g>
    <path d="M304 198H342" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round"/>
    <path d="M332 188L346 198L332 208" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(370 154)">
      <rect width="218" height="88" rx="18" fill="#FFFFFF" stroke="#D9E3EE"/>
      <text x="24" y="38" fill="#111827" font-size="18" font-weight="800">2. Right-click</text>
      <text x="24" y="64" fill="#617186" font-size="14">Action fits selection</text>
    </g>
    <path d="M610 198H648" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round"/>
    <path d="M638 188L652 198L638 208" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(676 154)">
      <rect width="218" height="88" rx="18" fill="#FFFFFF" stroke="#D9E3EE"/>
      <text x="24" y="38" fill="#111827" font-size="18" font-weight="800">3. Run action</text>
      <text x="24" y="64" fill="#617186" font-size="14">Runs locally</text>
    </g>
    <path d="M916 198H954" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round"/>
    <path d="M944 188L958 198L944 208" stroke="#9DB1C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(982 154)">
      <rect width="218" height="88" rx="18" fill="#ECFFF5" stroke="#BFEFD7"/>
      <circle cx="184" cy="27" r="13" fill="#2AD88F"/>
      <path d="M178 27L182 31L190 22" stroke="#063D28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="38" fill="#102033" font-size="18" font-weight="800">4. Done</text>
      <text x="24" y="64" fill="#477363" font-size="14">Path copied or file made</text>
    </g>
  </g>
</svg>
