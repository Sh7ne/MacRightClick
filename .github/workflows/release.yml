name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project MacRightClick.xcodeproj \
            -scheme MacRightClick \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/MacRightClickDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/MacRightClickDerivedData/Build/Products/Release/MacRightClick.app"
          package_root="$RUNNER_TEMP/MacRightClickDMG"
          dmg_path="$RUNNER_TEMP/MacRightClick.dmg"

          mkdir -p "$package_root"
          ditto --norsrc --noextattr "$app_path" "$package_root/MacRightClick.app"
          ln -s /Applications "$package_root/Applications"
          hdiutil create \
            -volname "Mac RightClick" \
            -srcfolder "$package_root" \
            -ov \
            -format UDZO \
            "$dmg_path"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/MacRightClick.dmg#MacRightClick.dmg" \
            --title "Mac RightClick $GITHUB_REF_NAME" \
            --generate-notes
